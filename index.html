
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            color: #2563eb;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 98%;
            padding: 12px;
            margin-top: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Division Calculator</h1>

    <p>Enter two numbers to perform division.</p>

    <input type="number" id="num"
           placeholder="Enter numerator" step="any">

    <input type="number" id="denominator"
           placeholder="Enter denominator" step="any">

    <button onclick="calculateDivision()">
        Calculate
    </button>

    <div id="result"></div>

    <a href="/docs" target="_blank">
        View API Documentation
    </a>

</div>

<script>

async function calculateDivision() {

    const num = document.getElementById("num").value;
    const denominator = document.getElementById("denominator").value;
    const result = document.getElementById("result");

    if (num === "" || denominator === "") {
        result.style.color = "red";
        result.innerText = "Please enter both numbers.";
        return;
    }

    try {

        const response = await fetch("/divide", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                num: Number(num),
                denominator: Number(denominator)
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Division failed");
        }

        result.style.color = "green";
        result.innerText = "Result = " + data.result;

    }

    catch (error) {
        result.style.color = "red";
        result.innerText = "Error: " + error.message;
    }
}

</script>

</body>
</html>
